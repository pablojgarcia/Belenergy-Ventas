services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-appuser}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-apppassword}"
      POSTGRES_DB: "${POSTGRES_DB:-authdb}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-appuser} -d ${POSTGRES_DB:-authdb}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Levanta el stack completo (Postgres + API con frontend web).
  # El Dockerfile multi-stage compila el frontend Flutter y FastAPI lo sirve
  # como SPA same-origin: todo vive en http://localhost:API_PORT.
  #
  # Cambios a la UI o al backend requieren rebuild (make rebuild) porque en
  # esta ruta no hay hot-reload. Para desarrollo con hot reload usar el local.
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${API_PORT:-8000}:8080"
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-appuser}:${POSTGRES_PASSWORD:-apppassword}@db:5432/${POSTGRES_DB:-authdb}"
      JWT_SECRET: "${JWT_SECRET:-dev-jwt-secret-change-me}"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:8000}"
      ODOO_URL: "${ODOO_URL:-https://belenergy-ventas.odoo.com}"
      ODOO_DB: "${ODOO_DB:-belenergy-ventas}"
      ODOO_USER: "${ODOO_USER:-}"
      ODOO_PASSWORD: "${ODOO_PASSWORD:-}"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  pgdata: